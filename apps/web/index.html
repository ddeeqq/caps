<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#FFD93B" />
    <!-- 화면은 밝은 색만 쓴다: 삼성 인터넷·크롬의 "강제 다크 모드"가 색을 뒤집지 않게 -->
    <meta name="color-scheme" content="light only" />
    <!-- 아이폰이 방 코드·연결 숫자를 전화번호 링크로 바꾸지 않게 -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="apple-mobile-web-app-title" content="말문" />
    <meta name="description" content="QR 하나로 입장해 폰으로 함께 노는 아이스브레이킹 게임" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>말문</title>
    <!-- 카카오톡·메신저 링크 미리보기. __ORIGIN__과 __TITLE__은 서버가 요청마다 채운다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="말문" />
    <meta property="og:title" content="__TITLE__" />
    <meta
      property="og:description"
      content="QR 하나로 들어와서, 폰을 들고 같이 노는 아이스브레이킹 20분. 앱 설치도 가입도 없어요."
    />
    <meta property="og:image" content="__ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="__ORIGIN____PATH__" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
